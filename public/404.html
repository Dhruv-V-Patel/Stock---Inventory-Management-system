<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>404 - Page Not Found | Payment Transactions System</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <!-- Apply saved theme -->
    <script>
      (() => {
        const theme = localStorage.getItem("theme") || "light";

        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --primary: #2563eb;
        --primary-hover: #1d4ed8;

        --background: #f4f7fb;
        --surface: #ffffff;

        --text-primary: #111827;
        --text-secondary: #6b7280;

        --border: #e5e7eb;
      }

      [data-theme="dark"] {
        --background: #0f172a;
        --surface: #111827;

        --text-primary: #f9fafb;
        --text-secondary: #9ca3af;

        --border: #293548;
      }

      body {
        min-height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 20px;

        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;

        background: var(--background);

        color: var(--text-primary);
      }

      /* ========================================
           404 Container
        ======================================== */

      .error-container {
        width: 100%;
        max-width: 520px;

        text-align: center;
      }

      /* ========================================
           Brand
        ======================================== */

      /* .error-brand {
            display: inline-flex;
            align-items: center;

            gap: 10px;

            margin-bottom: 40px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background: var(--primary);

            color: #ffffff;

            font-size: 18px;
        }

        .brand-text {
            text-align: left;
        }

        .brand-text strong {
            display: block;

            color: var(--text-primary);

            font-size: 15px;
            font-weight: 700;
        }

        .brand-text span {
            display: block;

            margin-top: 2px;

            color: var(--text-secondary);

            font-size: 10px;
        } */

      /* ========================================
           Error Icon
        ======================================== */

      .error-icon {
        width: 80px;
        height: 80px;

        display: flex;
        align-items: center;
        justify-content: center;

        margin: 0 auto 20px;

        border-radius: 50%;

        background: rgba(37, 99, 235, 0.1);

        color: var(--primary);

        font-size: 30px;
      }

      /* ========================================
           404 Number
        ======================================== */

      .error-code {
        margin-bottom: 8px;

        color: var(--primary);

        font-size: 72px;
        font-weight: 800;

        line-height: 1;
        letter-spacing: -3px;
      }

      /* ========================================
           Error Content
        ======================================== */

      .error-title {
        margin-bottom: 10px;

        color: var(--text-primary);

        font-size: 24px;
        font-weight: 700;
      }

      .error-description {
        max-width: 400px;

        margin: 0 auto 28px;

        color: var(--text-secondary);

        font-size: 13px;
        line-height: 1.7;
      }

      /* ========================================
           Buttons
        ======================================== */

      .error-actions {
        display: flex;
        align-items: center;
        justify-content: center;

        gap: 10px;
      }

      .error-button {
        min-height: 42px;

        display: inline-flex;
        align-items: center;
        justify-content: center;

        gap: 8px;

        padding: 0 18px;

        border: none;
        border-radius: 8px;

        font-size: 13px;
        font-weight: 600;

        text-decoration: none;

        cursor: pointer;

        transition:
          background 0.2s,
          color 0.2s,
          border-color 0.2s;
      }

      .primary-button {
        background: var(--primary);

        color: #ffffff;
      }

      .primary-button:hover {
        background: var(--primary-hover);
      }

      .secondary-button {
        border: 1px solid var(--border);

        background: var(--surface);

        color: var(--text-primary);
      }

      .secondary-button:hover {
        background: var(--background);
      }

      /* ========================================
           Developer Credit
        ======================================== */

      .developer-credit {
        margin-top: 50px;

        color: var(--text-secondary);

        font-size: 10px;
      }

      .developer-credit strong {
        display: block;

        margin-top: 3px;

        color: var(--text-secondary);

        font-size: 11px;
        font-weight: 600;
      }

      /* ========================================
           Mobile
        ======================================== */

      @media (max-width: 500px) {
        .error-code {
          font-size: 60px;
        }

        .error-title {
          font-size: 20px;
        }

        .error-actions {
          flex-direction: column;
        }

        .error-button {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <main class="error-container">
      <!-- Brand -->
      <!-- <div class="error-brand">
        <div class="brand-icon">
          <i class="fa-solid fa-indian-rupee-sign"></i>
        </div>

        <div class="brand-text">
          <strong> Payment Collection </strong>

          <span> Management System </span>
        </div>
      </div> -->

      <!-- Error Icon -->

      <div class="error-icon">
        <i class="fa-solid fa-file-circle-question"></i>
      </div>

      <!-- Error Code -->

      <div class="error-code">404</div>

      <!-- Error Message -->

      <h1 class="error-title">Page Not Found</h1>

      <p class="error-description">
        The page you are looking for doesn't exist, has been moved, or is
        temporarily unavailable.
      </p>

      <!-- Actions -->

      <div class="error-actions">
        <a href="/" class="error-button primary-button">
          <i class="fa-solid fa-house"></i>

          Go to Dashboard
        </a>

        <button
          type="button"
          class="error-button secondary-button"
          onclick="history.back()"
        >
          <i class="fa-solid fa-arrow-left"></i>

          Go Back
        </button>
      </div>

      <!-- Developer Credit -->

      <div class="developer-credit">
        <span> Designed & Developed by </span>

        <strong> Someshwar AI Solution LLP </strong>
      </div>
    </main>
  </body>
</html>
