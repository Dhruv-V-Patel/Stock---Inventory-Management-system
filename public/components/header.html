<header class="top-header">
    <!-- Left -->
    <div class="header-left">

        <!-- Mobile Menu -->
        <button type="button" class="header-menu-button" id="headerMenuButton" aria-label="Open menu">
            <i class="fa-solid fa-bars"></i>
        </button>

        <!-- Page Information -->
        <div class="header-page-info">
            <h1 id="pageTitle">Dashboard</h1>
            <p id="pageDescription">Overview of Someshwar AI ERP</p>
        </div>
    </div>

    <!-- Right -->
    <div class="header-right">
        <div class="notification-wrapper">

            <button type="button" class="header-action-button" id="notificationButton" title="Notifications">
                <i class="fa-regular fa-bell"></i>

                <span class="notification-dot hidden" id="notificationDot"></span>
            </button>

            <div id="notificationDropdown" class="notification-dropdown">
                <div class="notification-dropdown-header">
                    <h3>Notifications</h3>
                </div>

                <div id="notificationList" class="notification-list">
                    <div class="notification-loading">
                        Loading...
                    </div>
                </div>
            </div>

        </div>
        <!-- User -->
        <div class="header-user">
            <div class="header-avatar" id="headerUserAvatar">
            </div>
            <div class="header-user-info">
                <strong id="headerUserName"></strong>
                <span id="headerUserRole">
                </span>
            </div>
        </div>
    </div>
</header>
